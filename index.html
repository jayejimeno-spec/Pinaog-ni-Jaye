<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ano Batun</title>
<style>
  body {
    background-color: #fce4ec;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, #fff0f5 0%, #f8bbd0 100%);
    overflow: hidden;
  }

  /* --- ENVELOPE --- */
  .envelope {
    position: relative;
    width: 180px; 
    height: 120px; 
    background: #fff;
    border: 3px solid #ffb6c1;
    border-radius: 10px;
    z-index: 2;
    transition: transform 0.3s;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    margin-bottom: 40px;
  }

  .envelope::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 88px solid transparent; 
    border-right: 88px solid transparent;
    border-top: 60px solid #ffb6c1;
  }

  /* --- PUSO SA GITNA --- */
  .target-heart {
    position: absolute;
    top: 50%; 
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 38px; 
    z-index: 3;
    transition: opacity 0.1s;
    filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.3)); 
  }

  /* --- ANG LETTER CARD --- */
  .letter-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #fff;
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    z-index: -1;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    pointer-events: none;
    border: 2px solid #ffb6c1;
    width: 340px; 
    min-width: 340px;
  }

  .letter-content.is-open {
    transform: translate(-50%, -50%) scale(1);
    z-index: 10;
    pointer-events: auto;
  }

  .letter-content h2 {
    color: #e91e63;
    margin: 0 0 15px;
    font-size: 24px;
    white-space: nowrap; 
    letter-spacing: 0.5px;
  }

  .big-text {
    color: #d81b60;
    font-size: 24px; 
    font-weight: bold;
    margin: 0 0 30px;
    line-height: 1.2;
  }

  .button-container {
    display: flex;
    justify-content: space-between; 
    align-items: center;
    position: relative; 
    height: 50px; 
    width: 100%;
    padding: 0 10px; 
    box-sizing: border-box;
  }

  .btn {
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    border: none;
    transition: transform 0.2s, background-color 0.2s;
  }

  .btn-yes {
    background-color: #4caf50;
    color: white;
    z-index: 2;
  }

  .btn-yes:hover {
    background-color: #388e3c;
    transform: scale(1.05);
  }

  .btn-no {
    background-color: #f44336;
    color: white;
    position: relative; 
    z-index: 3;
    transition: all 0.2s ease-out;
  }

  /* --- BOW AND ARROW --- */
  .bow-area {
    position: absolute;
    bottom: 60px; 
    width: 100px;
    height: 120px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    z-index: 3;
    cursor: grab;
    transition: opacity 0.3s;
  }

  .bow-handle {
    width: 16px;
    height: 70px;
    background: linear-gradient(to right, #d7ccc8, #8d6e63, #d7ccc8);
    border-radius: 8px;
    position: relative;
    z-index: 2;
  }

  .bow-string {
    position: absolute;
    bottom: 10px;
    left: 50%;
    width: 2px;
    height: 70px;
    background: #333;
    transform: translateX(-50%);
    z-index: 1;
    transition: all 0.1s ease-out;
  }

  /* --- ARROW SETUP --- */
  .arrow {
    position: absolute;
    bottom: 90px; /* Simula sa taas ng pana */
    left: 50%;
    width: 6px;
    height: 50px;
    background: #e53935;
    transform: translateX(-50%);
    z-index: 4;
    opacity: 1;
    display: flex;
    justify-content: center;
    /* Tinanggal natin yung transition para hindi mahirapan i-animate */
  }

  .arrow::before {
    content: '';
    position: absolute;
    top: -14px;
    left: -5px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-bottom: 16px solid #e53935;
  }

  .arrow::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: -5px;
    width: 16px;
    height: 12px;
    background: #ffcdd2;
    border-radius: 2px;
  }

  /* --- BAGONG SHORT ANIMATION --- */
  /* Ang arrow ay aabot lang sa gitna ng envelope (around 200px pataas) 
     tapos biglang maglalaho (opacity: 0) */
  .arrow.shoot {
    animation: hitTarget 0.4s forwards cubic-bezier(0.25, 1, 0.5, 1);
  }

  @keyframes hitTarget {
    0% { bottom: 90px; opacity: 1; }
    80% { bottom: 210px; opacity: 1; } /* Tumama na sa puso */
    100% { bottom: 210px; opacity: 0; } /* Naglaho agad */
  }

  /* --- EXPLOSION EFFECT --- */
  .particle {
    position: absolute;
    top: 50%; /* Eksaktong gitna ng envelope */
    left: 50%;
    font-size: 20px;
    pointer-events: none;
    z-index: 15;
    opacity: 0;
    animation: explode 0.8s ease-out forwards;
  }

  @keyframes explode {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.2); }
  }

  /* --- FLOATING HEARTS BACKGROUND --- */
  .heart-bg {
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4081;
    transform: rotate(-45deg);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
  }

  .heart-bg::before,
  .heart-bg::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    background: #ff4081;
    border-radius: 50%;
  }

  .heart-bg::before { top: -10px; left: 0; }
  .heart-bg::after { top: 0; left: 10px; }

  .content.is-won .heart-bg {
    animation: floatHeart 3s ease-in-out infinite;
    opacity: 0.7;
  }

  .heart-bg:nth-child(1) { left: 10%; bottom: 20%; animation-delay: 0s; transform: scale(0.8) rotate(-45deg); }
  .heart-bg:nth-child(2) { left: 30%; bottom: 10%; animation-delay: 0.8s; transform: scale(1.2) rotate(-45deg); }
  .heart-bg:nth-child(3) { left: 75%; bottom: 25%; animation-delay: 0.4s; transform: scale(1) rotate(-45deg); }
  .heart-bg:nth-child(4) { left: 85%; bottom: 60%; animation-delay: 1.5s; transform: scale(0.6) rotate(-45deg); }
  .heart-bg:nth-child(5) { left: 20%; bottom: 70%; animation-delay: 2s; transform: scale(0.9) rotate(-45deg); }

  @keyframes floatHeart {
    0%, 100% { margin-bottom: 0; opacity: 0.5; }
    50% { margin-bottom: 30px; opacity: 1; }
  }

  .hint {
    position: absolute;
    bottom: 20px;
    font-size: 14px;
    color: #777;
    z-index: 5;
    font-weight: bold;
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  /* --- CUSTOM MODAL --- */
  .modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.6); 
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-box {
    background: white;
    padding: 40px 50px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    transform: scale(0.5);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 4px solid #ff4081;
  }

  .modal-overlay.show .modal-box {
    transform: scale(1); 
  }

  .modal-box h3 {
    color: #e91e63;
    font-size: 32px;
    margin: 0 0 10px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  .modal-box p {
    color: #555;
    font-size: 18px;
    margin: 0 0 20px;
  }

  .modal-btn {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 12px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 30px;
    cursor: pointer;
    transition: background-color 0.2s, transform 0.2s;
  }

  .modal-btn:hover {
    background-color: #e91e63;
    transform: scale(1.05);
  }
</style>
</head>
<body>

<div class="scene">
  
  <div class="envelope" id="envelope">
    <div class="target-heart" id="targetHeart">❤️</div>
    <div class="letter-content" id="letterContent">
      <h2>❤️ I Love You baby Ko ❤️</h2>
      <p class="big-text">Love mo paak baby?</p>
      <div class="button-container">
        <button class="btn btn-yes" id="btnYes">Yes</button>
        <button class="btn btn-no" id="btnNo">No</button>
      </div>
    </div>
  </div>

  <div class="content" id="heartContainer">
    <div class="heart-bg"></div>
    <div class="heart-bg"></div>
    <div class="heart-bg"></div>
    <div class="heart-bg"></div>
    <div class="heart-bg"></div>
  </div>

  <div class="bow-area" id="bowArea">
    <div class="bow-handle"></div>
    <div class="bow-string" id="bowString"></div>
  </div>
  
  <div class="arrow" id="arrow"></div>

  <div class="hint">Hold the bow - release to shoot 😉</div>

  <div class="modal-overlay" id="myModal">
    <div class="modal-box">
      <h3>Yun oh!</h3>
      <h1>Esmeringhoy na!</h1>
      <button class="modal-btn" id="closeModal">Bleeeeee</button>
    </div>
  </div>

</div>

<script>
  const bowArea = document.getElementById('bowArea');
  const bowString = document.getElementById('bowString');
  const arrow = document.getElementById('arrow');
  const letterContent = document.getElementById('letterContent');
  const heartContainer = document.getElementById('heartContainer');
  const targetHeart = document.getElementById('targetHeart');
  const btnNo = document.getElementById('btnNo');
  
  const btnYes = document.getElementById('btnYes');
  const myModal = document.getElementById('myModal');
  const closeModal = document.getElementById('closeModal');

  let isDrawing = false;

  function createExplosion() {
    const scene = document.querySelector('.scene');
    for (let i = 0; i < 15; i++) { // Dinagdagan ko ng konti yung particles
      const particle = document.createElement('div');
      particle.classList.add('particle');
      particle.innerText = ['❤️', '💖', '💕', '✨'][Math.floor(Math.random() * 4)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 40 + Math.random() * 80; // Konting adjust sa lapad ng sabog
      
      const tx = Math.cos(angle) * distance;
      const ty = Math.sin(angle) * distance;

      particle.style.setProperty('--tx', `${tx}px`);
      particle.style.setProperty('--ty', `${ty}px`);
      particle.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;

      scene.appendChild(particle);

      setTimeout(() => {
        particle.remove();
      }, 1000);
    }
  }

  function openLetter() {
    if (letterContent.classList.contains('is-open')) return;
    
    // 1. Maglaho yung puso
    targetHeart.style.opacity = '0';
    // 2. Sabog agad
    createExplosion();

    // 3. Pakita yung letter
    setTimeout(() => {
      letterContent.classList.add('is-open');
      heartContainer.classList.add('is-won');
      
      // Itago yung pana totally
      arrow.style.display = 'none';
      bowArea.style.opacity = '0';

      btnNo.style.position = 'relative';
      btnNo.style.left = '0px';
      btnNo.style.top = '0px';
    }, 300);
  }

  bowArea.addEventListener('mousedown', () => {
    if(arrow.style.display === 'none') return;
    isDrawing = true;
    arrow.style.bottom = '50px'; // Hinahatak pababa
    bowString.style.height = '90px';
    bowString.style.bottom = '0px';
  });

  window.addEventListener('mouseup', () => {
    if (isDrawing) {
      isDrawing = false;
      bowString.style.height = '70px';
      bowString.style.bottom = '10px';
      
      // Trigger shoot animation
      arrow.classList.add('shoot');

      // Timing: 400ms = tagal ng animation bago tumama. 
      // Pagtama, tsaka mag-e-explode at mawawala yung arrow.
      setTimeout(() => {
        openLetter();
      }, 400); // Sinabayan ko yung 0.4s animation
    }
  });

  function moveNoButton() {
    btnNo.style.position = 'absolute';
    const cardRect = letterContent.getBoundingClientRect();
    const randomX = Math.random() * (cardRect.width - 100); 
    const randomY = Math.random() * (cardRect.height - 100);

    btnNo.style.left = randomX + 'px';
    btnNo.style.top = randomY + 'px';
  }

  btnNo.addEventListener('mouseover', moveNoButton);
  btnNo.addEventListener('click', moveNoButton);
  btnNo.addEventListener('touchstart', moveNoButton);

  btnYes.addEventListener('click', () => {
    myModal.classList.add('show'); 
  });

  closeModal.addEventListener('click', () => {
    myModal.classList.remove('show');
    letterContent.classList.remove('is-open');
    heartContainer.classList.remove('is-won');

    setTimeout(() => {
      targetHeart.style.opacity = '1';
      bowArea.style.opacity = '1';
      arrow.style.display = 'flex';
      arrow.classList.remove('shoot'); 
      arrow.style.bottom = '90px';
      arrow.style.opacity = '1';
    }, 600); 
  });
</script>

</body>
</html>
